<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><meta name="theme-color" content="#ffffff"><title>Fernando's room</title>
<style>
:root{--blue:#1a73e8;--blue-dark:#1558b0;--ink:#202124;--muted:#5f6368;--line:#dadce0;--bg:#f8fafd;--green:#188038;--red:#d93025;--shadow:0 1px 3px #0002}*{box-sizing:border-box}body{margin:0;font-family:Roboto,Arial,sans-serif;color:var(--ink);background:#fff}button,input,textarea,select{font:inherit}button{cursor:pointer}.topbar{height:64px;display:flex;align-items:center;gap:16px;padding:0 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#fff;z-index:5}.brand{font-size:20px;color:var(--muted);display:flex;align-items:center;gap:9px;white-space:nowrap}.brand b{font-weight:500;color:#5f6368}.logo{height:34px;width:34px;border-radius:9px;background:var(--blue);color:white;display:grid;place-items:center;font-weight:bold;font-size:17px}.top-actions{margin-left:auto;display:flex;align-items:center;gap:10px}.iconbtn{border:0;background:transparent;border-radius:50%;width:42px;height:42px;font-size:21px;color:var(--muted)}.iconbtn:hover,.navitem:hover{background:#f1f3f4}.avatar{width:34px;height:34px;border-radius:50%;background:#7e57c2;color:white;display:grid;place-items:center;font-weight:600}.layout{display:flex;min-height:calc(100vh - 64px)}.sidebar{width:256px;padding:18px 12px;border-right:1px solid var(--line);flex:none}.navitem{border:0;width:100%;height:46px;border-radius:0 24px 24px 0;background:transparent;text-align:left;padding:0 18px;color:#3c4043;display:flex;align-items:center;gap:18px;font-size:14px}.navitem.active{background:#e8f0fe;color:#174ea6;font-weight:600}.navitem .ni{font-size:18px;width:18px;text-align:center}.navsection{font-size:12px;color:var(--muted);padding:22px 18px 8px}.classnav{max-height:42vh;overflow:auto}.classnav .navitem{height:42px}.classdot{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#5c6bc0;color:white;font-size:12px;font-weight:600;flex:none}.main{flex:1;min-width:0;padding:28px clamp(18px,4vw,58px) 60px;max-width:1440px;margin:0 auto}.welcome{display:flex;justify-content:space-between;align-items:center;margin:0 0 24px}.welcome h1{font-size:26px;font-weight:400;margin:0}.welcome p{color:var(--muted);margin:7px 0 0}.btn{border:0;border-radius:5px;padding:10px 17px;background:var(--blue);color:#fff;box-shadow:var(--shadow);font-weight:500}.btn:hover{background:var(--blue-dark)}.btn.secondary{background:white;color:var(--blue);border:1px solid var(--line);box-shadow:none}.btn.text{background:transparent;color:var(--blue);box-shadow:none}.room-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(255px,1fr));gap:20px}.room-card{border:1px solid var(--line);border-radius:9px;overflow:hidden;box-shadow:0 1px 2px #0001;transition:.15s;cursor:pointer}.room-card:hover{box-shadow:0 3px 8px #0002;transform:translateY(-1px)}.card-cover{height:118px;padding:18px;color:white;position:relative;background:linear-gradient(125deg,#4768b1,#283d79)}.card-cover h2{font-size:22px;font-weight:500;margin:0 0 7px;max-width:83%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.card-cover p{font-size:14px;margin:0;opacity:.92}.card-cover .more{position:absolute;right:10px;top:7px;color:white}.card-body{min-height:84px;padding:14px 16px;color:var(--muted);font-size:13px}.card-foot{height:54px;border-top:1px solid #eee;display:flex;justify-content:flex-end;align-items:center;padding:0 12px;gap:8px}.empty{border:1px dashed var(--line);border-radius:10px;padding:50px 20px;text-align:center;color:var(--muted)}.empty .big{font-size:42px;margin-bottom:12px}.classhead{height:210px;border-radius:10px;padding:27px 30px;color:white;background:linear-gradient(120deg,#4366ad,#243d76);position:relative;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;margin-bottom:20px}.classhead:after{content:'ƒ';font-size:250px;font-weight:700;position:absolute;right:9%;top:-83px;opacity:.08}.classhead h1{font-size:34px;font-weight:400;margin:0 0 10px;z-index:1}.classhead p{margin:0;z-index:1}.tabs{height:54px;border-bottom:1px solid var(--line);display:flex;gap:28px;margin-bottom:24px;overflow:auto}.tab{border:0;background:none;color:var(--muted);padding:0 8px;white-space:nowrap;position:relative}.tab.active{color:var(--blue);font-weight:600}.tab.active:after{content:'';height:3px;background:var(--blue);position:absolute;bottom:0;left:0;right:0;border-radius:3px 3px 0 0}.stream-layout{display:grid;grid-template-columns:minmax(0,1fr) 235px;gap:22px}.announcement{border:1px solid var(--line);border-radius:9px;padding:14px 16px;display:flex;align-items:center;gap:13px;color:var(--muted);box-shadow:var(--shadow);cursor:pointer;margin-bottom:20px}.announcement .avatar{width:38px;height:38px;background:#188038}.post{border:1px solid var(--line);border-radius:9px;margin:0 0 14px;overflow:hidden}.posthead{display:flex;gap:12px;align-items:center;padding:15px}.posthead .avatar{background:#188038}.posthead strong{font-weight:500}.posthead small{display:block;color:var(--muted);margin-top:4px}.postbody{padding:0 16px 17px;line-height:1.5;white-space:pre-wrap}.postfoot{padding:10px 15px;border-top:1px solid #eee;color:var(--muted);font-size:13px}.sidebox{border:1px solid var(--line);border-radius:9px;padding:17px;margin-bottom:14px}.sidebox h3{font-size:16px;font-weight:500;margin:0 0 12px}.sidebox p{color:var(--muted);font-size:13px;line-height:1.5}.assignment{border:1px solid var(--line);border-radius:9px;margin:0 0 12px;padding:16px;display:flex;align-items:center;gap:14px;cursor:pointer}.assignment:hover{background:#fafafa}.assign-icon{width:42px;height:42px;border-radius:50%;background:#e8f0fe;color:var(--blue);display:grid;place-items:center;font-size:20px;flex:none}.assign-main{min-width:0;flex:1}.assign-main strong{font-weight:500}.assign-main small{display:block;color:var(--muted);margin-top:5px}.badge{font-size:12px;border-radius:15px;padding:5px 9px;background:#e6f4ea;color:var(--green)}.badge.pending{background:#fef7e0;color:#9a6700}.person{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid #eee}.person:last-child{border:0}.person .avatar{background:#5c6bc0}.person small{display:block;color:var(--muted);margin-top:4px}.grades{width:100%;border-collapse:collapse;margin-top:10px}.grades th,.grades td{text-align:left;padding:13px;border-bottom:1px solid var(--line);font-size:14px}.grades th{color:var(--muted);font-weight:500}.grade-input{width:72px;padding:7px;border:1px solid var(--line);border-radius:5px}.modal-backdrop{position:fixed;inset:0;background:#0005;z-index:10;display:grid;place-items:center;padding:16px}.modal{width:min(540px,100%);max-height:90vh;overflow:auto;background:white;border-radius:12px;box-shadow:0 8px 30px #0003;padding:24px}.modal h2{font-size:21px;font-weight:500;margin:0 0 22px}.field{margin-bottom:16px}.field label{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}.field input,.field textarea,.field select{width:100%;border:1px solid #9aa0a6;border-radius:5px;padding:11px 12px;outline:none}.field input:focus,.field textarea:focus{border:2px solid var(--blue);padding:10px 11px}.field textarea{min-height:110px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:22px}.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#323232;color:white;padding:12px 18px;border-radius:6px;z-index:20;box-shadow:var(--shadow)}.hidden{display:none!important}.mobile-menu{display:none}.muted{color:var(--muted)}.code{font-weight:600;letter-spacing:.6px;color:#174ea6}.help{text-align:center;color:var(--muted);font-size:12px;margin-top:30px}
@media(max-width:760px){.topbar{height:58px;padding:0 12px;gap:10px}.brand{font-size:18px}.mobile-menu{display:block}.sidebar{display:none;position:fixed;top:58px;bottom:0;left:0;z-index:6;background:white;box-shadow:3px 0 10px #0002}.sidebar.open{display:block}.main{padding:22px 16px 45px}.welcome{align-items:flex-start;gap:10px}.welcome h1{font-size:23px}.welcome .btn{padding:9px 11px}.stream-layout{grid-template-columns:1fr}.stream-layout aside{order:-1}.sidebox{padding:13px}.classhead{height:185px;padding:22px}.classhead h1{font-size:29px}.room-grid{grid-template-columns:1fr}.tabs{gap:15px}.grades{min-width:540px}.table-wrap{overflow:auto}}
</style></head>
<body>
<header class="topbar"><button class="iconbtn mobile-menu" id="menuBtn" aria-label="Menu">☰</button><div class="brand"><div class="logo">F</div><b>Fernando's room</b></div><div class="top-actions"><button class="iconbtn" title="Ajuda" onclick="toast('Bem-vindo ao Fernando’s room!')">?</button><div class="avatar" title="Utilizador">N</div></div></header>
<div class="layout"><aside class="sidebar" id="sidebar"><button class="navitem active" data-page="home" onclick="goHome()"><span class="ni">⌂</span>Início</button><button class="navitem" onclick="showTasks()"><span class="ni">▣</span>A fazer</button><div class="navsection">DISCIPLINAS <span style="float:right;cursor:pointer" onclick="openRoomModal()">＋</span></div><div id="classNav" class="classnav"></div><div style="border-top:1px solid #eee;margin:16px 0"></div><button class="navitem" onclick="toast('As definições da conta estão guardadas neste dispositivo.')"><span class="ni">⚙</span>Definições</button></aside><main class="main" id="main"></main></div>
<div id="modalRoot"></div><div id="toastRoot"></div>
<script>
const KEY='fernandos_room_v1';const palettes=['linear-gradient(125deg,#4768b1,#283d79)','linear-gradient(125deg,#158e91,#07565b)','linear-gradient(125deg,#8152a8,#4f3178)','linear-gradient(125deg,#dd7956,#9f472e)','linear-gradient(125deg,#43875c,#24573a)'];
let data=load();let current=null;let currentTab='Mural';let editingTaskId=null;
function load(){try{let d=JSON.parse(localStorage.getItem(KEY));if(d&&Array.isArray(d.rooms))return d}catch(e){}return {rooms:[{id:'fernando',name:"Fernando's room",subject:'Matemática',section:'Turma de Matemática',code:'FER-2026',color:0,people:[{name:'Fernando',role:'Professor',grade:''},{name:'Namir Nehan',role:'Aluno',grade:''}],posts:[{id:'welcome',type:'post',title:'Bem-vindos ao Fernando’s room!',body:'Este é o mural da turma. Aqui podes acompanhar avisos, materiais e atividades de Matemática.',date:new Date().toISOString(),author:'Fernando'}],tasks:[]}]}}
function save(){localStorage.setItem(KEY,JSON.stringify(data))}function room(id){return data.rooms.find(r=>r.id===id)}function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function datefmt(d){return new Date(d).toLocaleDateString('pt-MZ',{day:'numeric',month:'short',year:'numeric'})}function toast(s){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast">'+esc(s)+'</div>';setTimeout(()=>r.innerHTML='',2600)}
function renderNav(){document.getElementById('classNav').innerHTML=data.rooms.map(r=>`<button class="navitem" onclick="openRoom('${r.id}')"><span class="classdot" style="background:${['#536dbe','#16868a','#8152a8','#c16b48','#43875c'][r.color%5]}">${esc((r.name||'?').slice(0,1).toUpperCase())}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.name)}</span></button>`).join('')}
function goHome(){current=null;document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));document.querySelector('[data-page="home"]').classList.add('active');renderHome();document.getElementById('sidebar').classList.remove('open')}
function renderHome(){renderNav();const main=document.getElementById('main');main.innerHTML=`<div class="welcome"><div><h1>Olá! 👋</h1><p>As tuas turmas e atividades num só lugar.</p></div><button class="btn" onclick="openRoomModal()">＋ Criar turma</button></div>${data.rooms.length?`<div class="room-grid">${data.rooms.map((r,i)=>`<article class="room-card" onclick="openRoom('${r.id}')"><div class="card-cover" style="background:${palettes[r.color%palettes.length]}"><h2>${esc(r.name)}</h2><p>${esc(r.section||r.subject||'')}</p><button class="iconbtn more" onclick="event.stopPropagation();roomOptions('${r.id}')">⋮</button></div><div class="card-body">${esc(r.subject||'Turma')}<br><span>${r.tasks.length} atividade${r.tasks.length===1?'':'s'} · ${r.people.length} participante${r.people.length===1?'':'s'}</span></div><div class="card-foot"><button class="iconbtn" title="Abrir turma" onclick="event.stopPropagation();openRoom('${r.id}')">▣</button></div></article>`).join('')}</div>`:`<div class="empty"><div class="big">▣</div><p>Ainda não tens turmas.</p><button class="btn" onclick="openRoomModal()">Criar a primeira turma</button></div>`}<p class="help">Fernando's room · As alterações ficam guardadas neste dispositivo.</p>`}
function openRoom(id,tab='Mural'){current=id;currentTab=tab;document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));renderRoom();document.getElementById('sidebar').classList.remove('open')}
function renderRoom(){const r=room(current);if(!r){goHome();return}renderNav();const main=document.getElementById('main');let tabs=['Mural','Atividades','Pessoas','Notas'];main.innerHTML=`<section class="classhead" style="background:${palettes[r.color%palettes.length]}"><h1>${esc(r.name)}</h1><p>${esc(r.section||'')}${r.subject?' · '+esc(r.subject):''}</p><button class="iconbtn more" style="position:absolute;right:16px;top:12px;color:white" onclick="roomOptions('${r.id}')">⋮</button></section><nav class="tabs">${tabs.map(t=>`<button class="tab ${currentTab===t?'active':''}" onclick="openRoom('${r.id}','${t}')">${t}</button>`).join('')}</nav><div id="tabContent"></div>`;let c=document.getElementById('tabContent');if(currentTab==='Mural')c.innerHTML=renderStream(r);else if(currentTab==='Atividades')c.innerHTML=renderTasks(r);else if(currentTab==='Pessoas')c.innerHTML=renderPeople(r);else c.innerHTML=renderGrades(r)}
function renderStream(r){let posts=[...r.posts].sort((a,b)=>new Date(b.date)-new Date(a.date));return `<div class="stream-layout"><section><div class="announcement" onclick="openPostModal()"><div class="avatar">N</div><span>Partilha um aviso com a turma...</span></div>${posts.length?posts.map(p=>`<article class="post"><div class="posthead"><div class="avatar">${esc((p.author||'F')[0])}</div><div><strong>${esc(p.author||'Fernando')}</strong><small>${datefmt(p.date)}${p.type==='task'?' · Atividade':''}</small></div></div>${p.title?`<div class="postbody"><strong>${esc(p.title)}</strong><br>${esc(p.body||'')}</div>`:`<div class="postbody">${esc(p.body||'')}</div>`}<div class="postfoot">${p.type==='task'?`▣ ${esc(p.due?`Entrega: ${datefmt(p.due)}`:'Atividade')} · <a href="#" onclick="event.preventDefault();openTask('${p.taskId}')" style="color:#1a73e8;text-decoration:none">Ver atividade</a>`:'💬 Adicionar comentário'}</div></article>`).join(''):`<div class="empty">Ainda não há publicações nesta turma.</div>`}</section><aside><div class="sidebox"><h3>Código da turma</h3><p>Partilha este código para convidar alunos:</p><div class="code">${esc(r.code)}</div><button class="btn text" onclick="copyCode('${r.code}')">Copiar código</button></div><div class="sidebox"><h3>Próximas atividades</h3>${r.tasks.filter(t=>!t.submitted).length?`<p>${r.tasks.filter(t=>!t.submitted).length} por entregar</p><button class="btn text" onclick="openRoom('${r.id}','Atividades')">Ver tudo</button>`:'<p>Nenhuma atividade pendente.</p>'}</div></aside></div>`}
function renderTasks(r){return `<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px"><div><h2 style="font-size:20px;font-weight:400;margin:0">Atividades da turma</h2><p class="muted">Consulta e entrega os trabalhos aqui.</p></div><button class="btn" onclick="openTaskModal()">＋ Criar atividade</button></div>${r.tasks.length?[...r.tasks].sort((a,b)=>new Date(b.created)-new Date(a.created)).map(t=>`<article class="assignment" onclick="openTask('${t.id}')"><div class="assign-icon">▣</div><div class="assign-main"><strong>${esc(t.title)}</strong><small>${esc(t.description||'Sem descrição')}${t.due?' · Entrega: '+datefmt(t.due):''}</small></div><span class="badge ${t.submitted?'':'pending'}">${t.submitted?'Entregue':'A fazer'}</span></article>`).join(''):`<div class="empty"><div class="big">▣</div><p>Ainda não há atividades.</p><button class="btn" onclick="openTaskModal()">Criar atividade</button></div>`}`}
function renderPeople(r){return `<div style="display:flex;justify-content:space-between;align-items:center"><h2 style="font-size:20px;font-weight:400">Professores</h2><button class="btn secondary" onclick="inviteInfo()">＋ Convidar pessoas</button></div>${r.people.filter(p=>p.role==='Professor').map(personHtml).join('')}<div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid var(--line);margin-top:20px;padding-top:10px"><h2 style="font-size:20px;font-weight:400">Alunos (${r.people.filter(p=>p.role==='Aluno').length})</h2><button class="btn text" onclick="inviteInfo()">＋ Convidar alunos</button></div>${r.people.filter(p=>p.role==='Aluno').map(personHtml).join('')||'<p class="muted">Ainda não há alunos nesta turma.</p>'}`}
function personHtml(p){return `<div class="person"><div class="avatar">${esc((p.name||'?')[0].toUpperCase())}</div><div><strong>${esc(p.name)}</strong><small>${esc(p.role)}</small></div></div>`}
function renderGrades(r){let students=r.people.filter(p=>p.role==='Aluno');return `<h2 style="font-size:20px;font-weight:400">Notas da turma</h2><p class="muted">Regista as notas dos alunos por atividade.</p>${r.tasks.length&&students.length?`<div class="table-wrap"><table class="grades"><thead><tr><th>Aluno</th>${r.tasks.map(t=>`<th>${esc(t.title)}</th>`).join('')}<th>Média</th></tr></thead><tbody>${students.map((p,pi)=>`<tr><td>${esc(p.name)}</td>${r.tasks.map(t=>{let g=(t.grades||{})[p.name];return `<td><input class="grade-input" type="number" min="0" max="100" placeholder="—" value="${g??''}" onchange="setGrade('${t.id}','${esc(p.name)}',this.value)"></td>`}).join('')}<td>${(()=>{let vals=r.tasks.map(t=>(t.grades||{})[p.name]).filter(v=>v!==''&&v!=null).map(Number);return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length)+'%':'—'})()}</td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><p>${!students.length?'Adiciona alunos à turma para gerir as notas.':'Cria atividades para começar a registar notas.'}</p></div>`}`}
function showTasks(){let t=data.rooms.flatMap(r=>r.tasks.map(a=>({...a,roomName:r.name,roomId:r.id})));current=null;document.querySelectorAll('.navitem').forEach(x=>x.classList.remove('active'));document.getElementById('main').innerHTML=`<div class="welcome"><div><h1>A fazer</h1><p>Atividades de todas as tuas turmas.</p></div></div>${t.length?t.map(a=>`<article class="assignment" onclick="openRoom('${a.roomId}','Atividades');setTimeout(()=>openTask('${a.id}'),0)"><div class="assign-icon">▣</div><div class="assign-main"><strong>${esc(a.title)}</strong><small>${esc(a.roomName)}${a.due?' · Entrega: '+datefmt(a.due):''}</small></div><span class="badge ${a.submitted?'':'pending'}">${a.submitted?'Entregue':'A fazer'}</span></article>`).join(''):`<div class="empty"><div class="big">✓</div><p>Não há atividades por agora.</p></div>`}`;document.getElementById('sidebar').classList.remove('open')}
function modal(title,body,submitLabel,fn){document.getElementById('modalRoot').innerHTML=`<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><h2>${title}</h2><form onsubmit="${fn}(event)">${body}<div class="modal-actions"><button type="button" class="btn secondary" onclick="closeModal()">Cancelar</button><button class="btn">${submitLabel}</button></div></form></div></div>`}
function closeModal(){document.getElementById('modalRoot').innerHTML=''}
function openRoomModal(){modal('Criar uma turma',`<div class="field"><label>Nome da turma *</label><input id="roomName" required placeholder="Ex.: Matemática 10ª classe"></div><div class="field"><label>Disciplina</label><input id="roomSubject" placeholder="Ex.: Matemática"></div><div class="field"><label>Secção</label><input id="roomSection" placeholder="Ex.: Turma A"></div>`,'Criar turma','createRoom')}
function createRoom(e){e.preventDefault();const r={id:'r'+Date.now(),name:document.getElementById('roomName').value.trim(),subject:document.getElementById('roomSubject').value.trim(),section:document.getElementById('roomSection').value.trim(),code:Math.random().toString(36).slice(2,8).toUpperCase(),color:data.rooms.length%palettes.length,people:[{name:'Fernando',role:'Professor',grade:''}],posts:[],tasks:[]};data.rooms.push(r);save();closeModal();renderNav();openRoom(r.id);toast('Turma criada!')}
function openPostModal(){modal('Publicar no mural',`<div class="field"><label>Aviso ou mensagem *</label><textarea id="postBody" required placeholder="Escreve uma mensagem para a turma..."></textarea></div>`,'Publicar','createPost')}
function createPost(e){e.preventDefault();const r=room(current);r.posts.push({id:'p'+Date.now(),type:'post',body:document.getElementById('postBody').value.trim(),date:new Date().toISOString(),author:'Fernando'});save();closeModal();renderRoom();toast('Publicação partilhada.')}
function openTaskModal(){modal('Criar atividade',`<div class="field"><label>Título *</label><input id="taskTitle" required placeholder="Ex.: Exercícios sobre frações"></div><div class="field"><label>Instruções</label><textarea id="taskDesc" placeholder="Explica o que os alunos devem fazer..."></textarea></div><div class="field"><label>Data de entrega</label><input id="taskDue" type="date"></div><div class="field"><label>Pontos</label><input id="taskPoints" type="number" min="0" value="100"></div>`,'Criar','createTask')}
function createTask(e){e.preventDefault();let r=room(current),title=document.getElementById('taskTitle').value.trim(),desc=document.getElementById('taskDesc').value.trim(),due=document.getElementById('taskDue').value;let t={id:'t'+Date.now(),title,description:desc,due,points:Number(document.getElementById('taskPoints').value)||100,created:new Date().toISOString(),submitted:false,grades:{}};r.tasks.push(t);r.posts.push({id:'p'+Date.now(),type:'task',title,body:desc,date:new Date().toISOString(),author:'Fernando',due,taskId:t.id});save();closeModal();renderRoom();toast('Atividade criada.')}
function openTask(id){editingTaskId=id;let r=room(current);let t=r?.tasks.find(x=>x.id===id);if(!t){for(const rr of data.rooms){t=rr.tasks.find(x=>x.id===id);if(t){r=rr;break}}}if(!t)return;modal(esc(t.title),`<p class="muted">${esc(r.name)}${t.due?' · Entrega: '+datefmt(t.due):''} · ${t.points} pontos</p><p style="white-space:pre-wrap;line-height:1.5">${esc(t.description||'Sem instruções adicionais.')}</p>${t.submitted?`<div class="field"><label>O teu trabalho</label><textarea id="submissionText">${esc(t.submission||'')}</textarea></div><p class="badge">Entregue</p>`:`<div class="field"><label>A tua resposta / trabalho</label><textarea id="submissionText" placeholder="Escreve a tua resposta ou notas sobre o ficheiro entregue..."></textarea></div>`}`,t.submitted?'Guardar alterações':'Marcar como entregue','submitTask')}
function submitTask(e){e.preventDefault();let text=document.getElementById('submissionText').value.trim();for(const r of data.rooms){let t=r.tasks.find(x=>x.id===editingTaskId);if(t){t.submitted=true;t.submission=text;save();closeModal();if(current)renderRoom();else showTasks();toast('Trabalho guardado como entregue.');return}}closeModal()}
function setGrade(taskId,name,value){let t=room(current).tasks.find(x=>x.id===taskId);if(!t)return;if(value===''||Number(value)<0){delete t.grades[name]}else t.grades[name]=Math.min(Number(value),100);save();renderRoom()}
function copyCode(code){navigator.clipboard?.writeText(code).then(()=>toast('Código copiado: '+code)).catch(()=>toast('Código da turma: '+code))||toast('Código da turma: '+code)}
function inviteInfo(){const r=room(current);alert(`Código da turma: ${r.code}\n\nPartilha este código com os alunos para os convidar a entrar.`)}
function roomOptions(id){const r=room(id);if(!r)return;const action=prompt(`Turma: ${r.name}\nEscreve “editar” para mudar o nome ou “apagar” para remover.`);if(!action)return;if(action.toLowerCase()==='editar'){current=id;modal('Editar turma',`<div class="field"><label>Nome</label><input id="roomName" required value="${esc(r.name)}"></div><div class="field"><label>Disciplina</label><input id="roomSubject" value="${esc(r.subject||'')}"></div><div class="field"><label>Secção</label><input id="roomSection" value="${esc(r.section||'')}"></div>`,'Guardar','updateRoom')}else if(action.toLowerCase()==='apagar'){if(confirm(`Apagar a turma “${r.name}” e os seus dados deste dispositivo?`)){data.rooms=data.rooms.filter(x=>x.id!==id);save();goHome();toast('Turma apagada.')}}}
function updateRoom(e){e.preventDefault();let r=room(current);r.name=document.getElementById('roomName').value.trim();r.subject=document.getElementById('roomSubject').value.trim();r.section=document.getElementById('roomSection').value.trim();save();closeModal();renderRoom();toast('Turma atualizada.')}
document.getElementById('menuBtn').addEventListener('click',()=>document.getElementById('sidebar').classList.toggle('open'));renderHome();
</script></body></html>
